# Main website routes from nginx-configs/twreporter-nginx-v2/nginx.conf.template.
# Keep location order and rewrite semantics when updating this copy.
# Match the ingress container's 1 vCPU without relying on host CPU discovery.
worker_processes 1;
error_log /dev/stderr error;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout combined;

  proxy_buffering on;
  proxy_buffer_size 4k;
  proxy_buffers 24 4k;
  proxy_busy_buffers_size 8k;
  # Avoid response spill files on Cloud Run's memory-backed filesystem.
  proxy_max_temp_file_size 0;

  # External HTTPS origins require their own Host and TLS server name.
  proxy_ssl_server_name on;
  proxy_ssl_name $proxy_host;
  proxy_ssl_verify on;
  proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

  map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
  }
  map $forwarded_proto $forwarded_port_default {
    default 80;
    https 443;
  }
  map $http_x_forwarded_port $forwarded_port {
    default $http_x_forwarded_port;
    "" $forwarded_port_default;
  }

  server {
    server_name _;

    listen 0.0.0.0:8080 default_server;
    port_in_redirect off;
    set $upstream http://127.0.0.1:3000;

    location ^~ /nginx_status { return 404; }
    location = /PURGE { return 404; }
    location ^~ /PURGE/ { return 404; }

    # Preserve public HTTPS redirects when TLS terminates before nginx.
    location = /sitemaps { return 301 $forwarded_proto://$http_host/sitemaps/$is_args$args; }
    location = /twreporter-infographics { return 301 $forwarded_proto://$http_host/twreporter-infographics/$is_args$args; }
    location = /i { return 301 $forwarded_proto://$http_host/i/$is_args$args; }

    location = /a/rss2.xml {
      return 301 https://public.twreporter.org/rss/twreporter-rss.xml;
    }

    location ^~ /sitemaps/ {
      proxy_pass https://storage.googleapis.com/twreporter-sitemaps/;
    }

    location ^~ /storage {
      rewrite ^/storage/(.*) https://www.twreporter.org/$1 permanent;
    }

    location ~ /a/(infographic-for-the-turtles|infographic-far-sea-fishing|infographics-2016-election|olympic-2016|homofamily-legislation|homofamily-15cards|film-center) {
      rewrite ^/a/(.*) https://www.twreporter.org/i/$1 permanent;
    }

    location ^~ /i/olympic-2016 {
      proxy_pass https://twreporter.github.io/infographics/olympic-2016/public/;
    }

    location ^~ /i/film-center {
      proxy_pass https://twreporter.github.io/infographics/film-center/01/;
    }

    location = /i/steel-slag {
      proxy_pass https://twreporter.github.io/infographics/steel-slag/01/index.html;
    }

    location = /a/steel-slag-2 {
      rewrite ^ https://www.twreporter.org/i/steel-slag permanent;
    }

    location = /a/steel-slag/ {
      rewrite ^ https://www.twreporter.org/i/steel-slag permanent;
    }

    location = /a/steel-slag {
      rewrite ^ https://www.twreporter.org/i/steel-slag permanent;
    }

    location ~ /i/(photoessay-far-sea-fishing|eng-photoessay-far-sea-fishing|animal-protection|eng-animal-protection) {
      rewrite ^/i/(.*) https://www.twreporter.org/a/$1 redirect;
    }

    location ~ /a/(photoessay-far-sea-fishing|eng-photoessay-far-sea-fishing|animal-protection|eng-animal-protection) {
      rewrite ^/a/([^/]*)/?(.*)$ /infographics/$1/dist/$2 break;
      proxy_pass https://twreporter.github.io;
    }

    location = /i/homofamily-15cards {
      proxy_pass https://twreporter.github.io/infographics/homofamily/dist/infocard.html;
    }

    location = /i/homofamily-legislation {
      proxy_pass https://twreporter.github.io/infographics/homofamily/dist/index.html;
    }

    location ^~ /i/infographics-2016-election {
      proxy_pass https://twreporter.github.io/infographics/election-proportion/;
    }

    location = /i/infographic-far-sea-fishing {
      proxy_pass https://storage.googleapis.com/twreporter-infographics/infographic-far-sea-fishing-gcs/dist/index.html;
    }

    location = /i/infographic-for-the-turtles {
      proxy_pass https://storage.googleapis.com/twreporter-infographics/infographic-for-the-turtles-gcs/dist/index.html;
    }

    location = /a/min-wage-draft {
      rewrite ^ https://www.twreporter.org/i/min-wage-draft permanent;
    }

    location = /i/min-wage-draft {
      proxy_pass https://storage.googleapis.com/twreporter-infographics/min-wage-draft/index.html;
    }

    location ^~ /i/min-wage-draft {
      rewrite ^/i/min-wage-draft/?(.*) /twreporter-infographics/min-wage-draft/$1 break;
      proxy_pass https://storage.googleapis.com;
    }

    location = /i/hedwig-and-the-angry-inch-artist {
      proxy_pass https://storage.googleapis.com/twreporter-infographics/hedwig-and-the-angry-inch-artist/dist/index.html;
    }

    location = /i/high-risk-youth-life-is-a-struggle {
      proxy_pass https://storage.googleapis.com/twreporter-infographics/high-risk-youth-life-is-a-struggle/dist/index.html;
    }

    location = /i/legislative-committee-20160201 {
      rewrite ^ https://www.twreporter.org/i/new-mp/20160201/ permanent;
    }

    location = /i/legislative-committee-20160222 {
      rewrite ^ https://www.twreporter.org/i/legislative-committee/20160222/ permanent;
    }

    location = /i/draw-taiwaness-recognition {
      proxy_pass https://twreporter.github.io/infographics/draw-taiwaness-recognition/index.html;
    }

    location = /i/fifth-plant {
      rewrite ^ https://twreporter.github.io/infographics/fifth-plant/index.html permanent;
    }

    location = /topics/photo-2018-wonder-foto-day {
      rewrite ^ $forwarded_proto://$host/topics/wonder-foto-day permanent;
    }

    location ~ /i/.*-gcs {
      rewrite ^/i/(.*) /twreporter-infographics/$1/dist/index.html break;
      proxy_pass https://storage.googleapis.com;
    }

    location ~ /(dist|asset|meta)/ {
      include /etc/nginx/react-proxy.conf;
      proxy_pass $upstream$request_uri;
    }

    location ^~ /twreporter-infographics/ {
      proxy_hide_header "Cache-Control";
      proxy_hide_header "Expires";

      add_header Cache-Control "public, max-age=604800";

      proxy_pass https://storage.googleapis.com;
    }

    location /i/ {
      rewrite ^/i/(.*) /infographics/$1 break;
      proxy_pass https://twreporter.github.io;
    }

    location = /_CHECK_ { return 404; }

    location ~ /donation(\/(one-time|period))?$ {
      return 301 https://support.twreporter.org;
    }

    location ~ /a/about-us-footer {
      return 301 https://$host/about-us;
    }

    location = /check {
      expires -1;
      include /etc/nginx/react-proxy.conf;
      proxy_pass $upstream$request_uri;
    }

    location ~ ^/(images|audios|videos|assets) {
      rewrite ^/(.*) /twreporter-multimedia/$1 break;

      proxy_pass https://storage.googleapis.com;
    }

    location = /topics/media-center {
      return 301 https://$host/categories/foundation;
    }

    location / {
      include /etc/nginx/react-proxy.conf;
      proxy_pass $upstream$request_uri;
    }
  }
}
