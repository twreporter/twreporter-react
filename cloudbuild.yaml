# Push triggers and base IAM: https://github.com/twreporter/gcp-infrastructure
steps:
  - id: build-app
    name: node:24.22.1
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        case "${BRANCH_NAME}" in
          dev|staging) environment="${BRANCH_NAME}"; runtime=nonprod ;;
          release) environment=prod; runtime=prod ;;
          *) echo 'Expected dev, staging or release branch.' >&2; exit 1 ;;
        esac
        [[ -f "deploy/env.$${environment}.public.yaml" ]] || exit 1
        # Share the branch mapping with the deploy step.
        printf 'environment=%s\nruntime=%s\n' "$$environment" "$$runtime" > .cloud-run.env
        [[ "$$(yarn --version)" == 1.22.22 ]]
        export NODE_ENV=production RELEASE_BRANCH="${BRANCH_NAME}"
        yarn install --frozen-lockfile --production=false
        make build
        rm -rf node_modules
        yarn install --production --frozen-lockfile
        for file in dist/server.js config.js sw.js webpack-assets.json loadable-stats.json; do
          test -s "$$file"
        done
        test -d static/asset
  - id: build-image
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        docker build --platform=linux/amd64 \
          --build-arg NODE_ENV=production --build-arg RELEASE_BRANCH="${BRANCH_NAME}" \
          -t "asia-east1-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/twreporter-react:${BRANCH_NAME}-${COMMIT_SHA}-${BUILD_ID}" .
  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - asia-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/twreporter-react:$BRANCH_NAME-$COMMIT_SHA-$BUILD_ID
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:stable
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        source .cloud-run.env
        if [[ "$$environment" == prod ]]; then
          max_instances=10
        else
          max_instances=3
        fi
        region=asia-east1
        service="$${environment}-twreporter-react"
        image="$${region}-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/twreporter-react"
        tag="${BRANCH_NAME}-${COMMIT_SHA}-${BUILD_ID}"
        gcloud run deploy "$$service" --project="${PROJECT_ID}" --region="$$region" \
          --image="$$image:$$tag" \
          --service-account="sa-www-$${runtime}-runtime@${PROJECT_ID}.iam.gserviceaccount.com" \
          --cpu=1 --memory=1Gi --no-cpu-throttling \
          --concurrency=20 --scaling=auto --min=0 --max="$$max_instances" --port=3000 \
          --min-instances=default --max-instances=default \
          --ingress=internal-and-cloud-load-balancing --allow-unauthenticated \
          --env-vars-file="deploy/env.$${environment}.public.yaml" \
          --set-secrets="COOKIE_SECRET=$${service}_cookie-secret:latest" \
          --quiet

options:
  logging: CLOUD_LOGGING_ONLY
timeout: 1800s
